name: Portfolio static checks

on:
  pull_request:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Check translation JavaScript syntax
        run: node --check i18n.js
      - name: Test bilingual language switching
        run: node tests/test_i18n.js
      - name: Validate Wokwi project diagram and firmware invariants
        run: node tests/test_wokwi_lab.cjs
      - name: Validate local assets, navigation anchors and filter markup
        run: python3 -m unittest discover -s tests -p 'test_site.py' -v
