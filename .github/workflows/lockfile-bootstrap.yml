name: Bootstrap deterministic npm lockfile (temporary)

on:
  push:
    branches:
      - feature/performance-a11y-cicd

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate package-lock.json from exact package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit reproducible dependency tree to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(deps): lock reproducible npm dependency tree"
            git push origin HEAD:feature/performance-a11y-cicd
          fi
